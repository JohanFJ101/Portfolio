<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f6ee" />
    <link
      rel="preload"
      href="/assets/anton-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Johan Jagalur</title>
  </head>
  <body>
    <div class="page-loader" role="status" aria-label="Loading portfolio">
      <span class="page-loader__card" aria-hidden="true"></span>
    </div>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark theme"
      aria-pressed="false"
    >
      <span class="theme-toggle__thumb" aria-hidden="true"></span>
    </button>

    <main class="hero" aria-label="Johan Jagalur portfolio">
      <div class="card-stage">
        <article
          id="business-card"
          class="business-card"
          aria-label="Johan Jagalur business card"
          aria-expanded="false"
        >
          <div class="business-card__contact">
            <a class="business-card__contact-link" href="tel:+16025009057"
              >+1 (602) 500 9057</a
            >
            <a class="business-card__contact-link" href="mailto:johanj@asu.edu"
              >johanj@asu.edu</a
            >
          </div>

          <h1 class="business-card__name">Johan Jagalur.</h1>

          <nav class="social-links" aria-label="Social links">
            <a
              class="social-link social-link--linkedin"
              href="https://www.linkedin.com/in/johan-jagalur-8907822b9"
              target="_blank"
              rel="noreferrer"
              aria-label="LinkedIn"
            >
              <img src="/assets/figma-image-2.png" alt="" />
            </a>
            <a
              class="social-link social-link--github"
              href="https://github.com/JohanFJ101"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub"
            >
              <img src="/assets/figma-image-3.png" alt="" />
            </a>
          </nav>
        </article>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
